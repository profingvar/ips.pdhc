name: FHIR R5 conformance

# Ticket #390 (rollup #349) — gate PRs on canonical HL7 FHIR R5
# conformance of the CapabilityStatement that ips.pdhc advertises.
# Scope narrowed per termbank #363 / request.pdhc #377 (Rule 15 A):
# clinical resource shape polish is a separate, later ticket.
#
# The pytest workflow (test.yml, #389) covers the app-level tests;
# this workflow covers the slow / canonical layer: the official HL7
# validator_cli.jar against the CS emitted from /fhir/metadata.

on:
  pull_request:
    branches: [main]
    paths:
      - 'gateway/app/fhir/**'
      - 'gateway/app/services/fhir_service.py'
      - 'gateway/app/models/capability_statement.py'
      - 'gateway/tests/conformance_corpus_emit.py'
      - 'gateway/requirements.txt'
      - 'gateway/Makefile'
      - '.github/workflows/conformance.yml'
  push:
    branches: [main]
    paths:
      - 'gateway/app/fhir/**'
      - 'gateway/app/services/fhir_service.py'
      - 'gateway/app/models/capability_statement.py'
      - 'gateway/tests/conformance_corpus_emit.py'
      - 'gateway/requirements.txt'
      - 'gateway/Makefile'
      - '.github/workflows/conformance.yml'
  workflow_dispatch: {}

env:
  # Pin the validator version so CI is reproducible. Matches termbank
  # / plan.pdhc / request.pdhc. Bump only after `make conformance`
  # succeeds locally with the new jar.
  VALIDATOR_VERSION: '6.9.10'
  FHIR_VERSION: '5.0.0'
  TX_SERVER: 'https://tx.fhir.org/r5'

jobs:
  conformance:
    runs-on: ubuntu-latest
    # Local run against tx.fhir.org (cold cache) ~1-3 min for the CS
    # only. 15 minutes gives headroom for tx latency + package pulls
    # (ips corpus loads the hl7.fhir.uv.ips.r4 package via the $ips
    # OperationDefinition reference).
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: gateway/requirements.txt

      - name: Cache validator_cli.jar
        id: cache-jar
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fhir/validator_cli.jar
          key: fhir-validator-${{ env.VALIDATOR_VERSION }}

      - name: Download validator_cli.jar (on cache miss)
        if: steps.cache-jar.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/fhir
          curl -sSL \
            -o ~/.local/share/fhir/validator_cli.jar \
            'https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${{ env.VALIDATOR_VERSION }}/validator_cli.jar'
          ls -lh ~/.local/share/fhir/validator_cli.jar

      - name: Install Python deps
        working-directory: gateway
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Emit corpus
        working-directory: gateway
        env:
          FLASK_ENV: 'testing'
          SECRET_KEY: 'ci-only-not-secret'
        run: make corpus

      - name: Run HL7 R5 conformance validator
        working-directory: gateway
        run: |
          # Makefile defaults VALIDATOR_JAR to $(HOME)/.local/share/fhir/
          # validator_cli.jar; that path is already populated by the
          # cache / download step above.
          make conformance

      - name: Upload corpus artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fhir-corpus
          path: gateway/tests/fhir_corpus/
          retention-days: 7
